[build]
  command = "npm run build"
  publish = "build/client"
  functions = "netlify/functions"

[functions]
  included_files = ["build/**"]

[dev]
  command = "npm run dev"
  port = 3000

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[[headers]]
  for = "/build/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable" 